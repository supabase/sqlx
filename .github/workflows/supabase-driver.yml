name: Supabase driver

on:
  pull_request:
    branches: [supabase/0.9]
  push:
    branches: [supabase/0.9]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  driver:
    name: Supabase driver checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Upstream does not track Cargo.lock; freeze one resolution for this run.
      - name: Resolve dependencies
        run: cargo +1.95.0 generate-lockfile
      - name: Format
        run: cargo +1.95.0 fmt --all -- --check
      - name: Lint affected libraries
        run: >-
          cargo +1.95.0 clippy --locked -p sqlx-core -p sqlx-postgres --lib
          --no-default-features --features sqlx-core/_rt-tokio,sqlx-core/_tls-rustls-ring-webpki
          -- -D warnings
      - name: Core and PostgreSQL unit tests
        run: >-
          cargo +1.95.0 test --locked -p sqlx-core -p sqlx-postgres --lib
          --no-default-features --features sqlx-core/_rt-tokio,sqlx-core/_tls-rustls-ring-webpki
      - name: Runtime-free compatibility
        run: cargo +1.95.0 check --locked -p sqlx-core -p sqlx-postgres --lib --no-default-features
      - name: Other runtime compatibility
        run: >-
          cargo +1.95.0 check --locked -p sqlx-core -p sqlx-postgres --lib
          --no-default-features --features sqlx-core/_rt-async-io
      - name: MySQL shared-core compatibility
        run: >-
          cargo +1.95.0 check --locked -p sqlx-core -p sqlx-mysql --lib
          --no-default-features --features sqlx-core/_rt-tokio
      - name: Create hostname-verification test certificate
        run: |
          openssl req -new -key tests/certs/keys/server.key -subj /CN=localhost \
            -out "$RUNNER_TEMP/server.csr"
          printf '%s\n' 'subjectAltName=DNS:localhost' \
            'basicConstraints=critical,CA:FALSE' 'extendedKeyUsage=serverAuth' \
            > "$RUNNER_TEMP/server.ext"
          openssl x509 -req -in "$RUNNER_TEMP/server.csr" -CA tests/certs/ca.crt \
            -CAkey tests/certs/keys/ca.key -set_serial 2 -days 1 \
            -extfile "$RUNNER_TEMP/server.ext" -out "$RUNNER_TEMP/server.crt"
      - name: Start PostgreSQL fixture
        run: |
          docker compose -f tests/docker-compose.yml run -d -p 5432:5432 \
            -v "$RUNNER_TEMP/server.crt:/var/lib/postgresql/server.crt:ro" \
            --name supabase-driver-postgres postgres_17
          for _ in {1..60}; do
            if docker exec supabase-driver-postgres pg_isready -h 127.0.0.1; then
              exit 0
            fi
            sleep 1
          done
          docker logs supabase-driver-postgres
          exit 1
      - name: PostgreSQL connection and pool tests with verified TLS
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/sqlx?sslmode=verify-full&sslrootcert=.%2Ftests%2Fcerts%2Fca.crt
        run: |
          for test in it_connects it_pings it_executes_with_pool it_can_fail_and_recover_with_pool; do
            cargo +1.95.0 test --locked --no-default-features \
              --features postgres,macros,runtime-tokio,tls-rustls-ring \
              --test postgres -- --exact "$test"
          done
          for test in tls_hostname_mismatch_is_rejected tls_untrusted_ca_is_rejected tls_hostaddr_preserves_verification; do
            cargo +1.95.0 test --locked --no-default-features \
              --features postgres,macros,runtime-tokio,tls-rustls-ring \
              --test postgres -- --ignored --exact "$test"
          done
      - name: Minimum supported compiler
        run: |
          rustup toolchain install 1.94 --profile minimal
          cargo +1.94 check --locked -p sqlx-core -p sqlx-postgres --lib \
            --no-default-features --features sqlx-core/_rt-tokio,sqlx-core/_tls-rustls-ring-webpki
      - name: Stop PostgreSQL fixture
        if: always()
        run: docker rm --force supabase-driver-postgres
